services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    ports:
      - '${CONVEX_PORT:-3210}:3210'
      - '${CONVEX_SITE_PORT:-3211}:3211'
    volumes:
      - convex-data:/convex/data
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-ai-town-local}
      INSTANCE_SECRET: ${INSTANCE_SECRET:-ai-town-local-secret-change-me}
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${CONVEX_PORT:-3210}}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${CONVEX_SITE_PORT:-3211}}
      DATABASE_URL: ${DATABASE_URL:-}
      ACTIONS_USER_TIMEOUT_SECS: ${ACTIONS_USER_TIMEOUT_SECS:-120}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_CHAT_API_URL: ${LLM_CHAT_API_URL:-}
      LLM_CHAT_COMPLETIONS_URL: ${LLM_CHAT_COMPLETIONS_URL:-}
      LLM_CHAT_API_KEY: ${LLM_CHAT_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EMBEDDING_API_URL: ${LLM_EMBEDDING_API_URL:-}
      LLM_EMBEDDINGS_URL: ${LLM_EMBEDDINGS_URL:-}
      LLM_EMBEDDING_API_KEY: ${LLM_EMBEDDING_API_KEY:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3210/version']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    ports:
      - '${DASHBOARD_PORT:-6791}:6791'
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${VITE_CONVEX_URL:-http://127.0.0.1:${CONVEX_PORT:-3210}}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex-data:
